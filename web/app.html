<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Aoto</title>
<meta property="og:title" content="Playlist di Aoto">
<style>
  :root{color-scheme:dark;--bg:#0b1030;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--ac:#6c93ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#1b1f5e,var(--bg) 60%);color:#fff;min-height:100vh}
  main{max-width:520px;margin:0 auto;padding:28px 18px 60px}
  .brand{font-weight:800;letter-spacing:.5px;opacity:.85;margin-bottom:18px}
  .hero{display:flex;gap:16px;align-items:center}
  .cover{width:96px;height:96px;border-radius:20px;object-fit:cover;background:var(--card);flex:none}
  h1{font-size:24px;line-height:1.15;margin:0 0 6px}
  .muted{color:rgba(255,255,255,.62);font-size:14px}
  .creator{display:flex;gap:12px;align-items:center;margin:20px 0;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .grow{flex:1;min-width:0}
  .lvl{font-weight:800;color:var(--ac)}
  .btns{display:flex;gap:10px;margin-bottom:22px}
  a.btn{flex:1;text-align:center;padding:14px;border-radius:50px;font-weight:700;text-decoration:none;color:#0b1030;background:#fff}
  a.btn.alt{background:var(--card);color:#fff;border:1px solid var(--line)}
  ol{list-style:none;margin:0;padding:0}
  li{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
  li img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--card);flex:none}
  li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .n{width:22px;color:rgba(255,255,255,.4);font-size:13px;flex:none}
  .err{padding:40px 10px;text-align:center}
  .pbanner{height:150px;margin:-28px -18px 0;background:linear-gradient(135deg,var(--ac),#12163a);background-size:cover;background-position:center;position:relative}
  .pbanner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(11,16,48,.9))}
  .pav{margin-top:-46px;position:relative;z-index:1;display:flex;align-items:flex-end;gap:14px}
  .pav .avatar{width:92px;height:92px;font-size:34px;border:3px solid var(--ac);box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:50px;background:var(--card);border:1px solid var(--line);font-size:13px;margin:10px 8px 0 0}
  .badge{display:inline-block;padding:4px 10px;margin:8px 6px 0 0;border-radius:50px;border:1px solid var(--ac);color:var(--ac);font-size:12px;font-weight:700}
  .stats{display:flex;gap:10px;margin:22px 0}
  .stat{flex:1;text-align:center;padding:14px 4px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid var(--line)}
  .stat .v{font-weight:800;font-size:20px;color:var(--ac)}
  .sect{font-weight:700;font-size:15px;margin:26px 0 8px}
  .priv{margin:30px 0;padding:26px;border-radius:20px;text-align:center;background:var(--card);border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <div class="brand">♪ Aoto</div>
  <div id="app" class="muted">Memuat…</div>
</main>
<script>
// ISI DUA BARIS INI (sama seperti CLOUD_URL dan CLOUD_KEY di build aplikasi; kunci anon memang publik).
const CLOUD_URL = "GANTI_CLOUD_URL";
const CLOUD_KEY = "GANTI_CLOUD_KEY";
// Alamat unduh aplikasi (halaman rilis GitHub dsb). Boleh dikosongkan.
const DOWNLOAD_URL = "";

const code = new URLSearchParams(location.search).get("c") || (location.pathname.match(/\/p\/([A-Za-z0-9]+)/) || [])[1] || "";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Hanya gambar https yang ditampilkan (data dari pengguna lain tidak dipercaya).
const safeImg = u => /^https:\/\//i.test(String(u || "")) ? String(u) : "";
const artist = s => String(s || "").split(" • ")[0];

const uname = (location.pathname.match(/\/u\/([A-Za-z0-9_.]{3,20})/) || [])[1] || "";

async function loadProfile() {
  try {
    const r = await fetch(CLOUD_URL + "/rest/v1/rpc/get_public_profile", {
      method: "POST",
      headers: {apikey: CLOUD_KEY, Authorization: "Bearer " + CLOUD_KEY, "Content-Type": "application/json"},
      body: JSON.stringify({p_username: uname})
    });
    const d = r.ok ? await r.json() : null;
    if (!d) return fail("Profil ini tidak ditemukan atau tidak dibuat publik.");
    renderProfile(d);
  } catch (e) { fail("Tidak bisa menghubungi server."); }
}
function hours(sec) { const h = sec / 3600; return h >= 10 ? Math.round(h) + " jam" : h.toFixed(1).replace(".", ",") + " jam"; }
function renderProfile(d) {
  const name = d.name || d.username;
  document.title = name + " · Aoto";
  if (/^#[0-9A-Fa-f]{6}$/.test(d.accent || "")) document.documentElement.style.setProperty("--ac", d.accent);
  const av = safeImg(d.avatar) ? '<img class="avatar" src="' + esc(safeImg(d.avatar)) + '" alt="">'
                               : '<div class="avatar">' + esc(name.slice(0,1).toUpperCase()) + '</div>';
  const bn = safeImg(d.banner);
  const stat = (v, l) => '<div class="stat"><div class="v">' + esc(v) + '</div><div class="muted" style="font-size:11px">' + l + '</div></div>';
  const top = d.top || [];
  const badges = (d.badges || []).slice(0, 5).map(b => '<span class="badge">' + esc(b) + '</span>').join("");
  const status = (d.status || "").trim();
  const joined = d.joined ? new Date(d.joined).toLocaleDateString("id-ID", {month: "long", year: "numeric"}) : "";
  const setBanner = () => { const el = document.getElementById("pbn"); if (el && bn) el.style.backgroundImage = 'url("' + encodeURI(bn).replace(/['"()]/g, encodeURIComponent) + '")'; };
  app.innerHTML =
    '<div class="pbanner" id="pbn"></div>' +
    '<div class="pav">' + av + '<div style="padding-bottom:6px;min-width:0"><h1 style="margin:0">' + esc(name) + '</h1><div class="muted">@' + esc(d.username) + '</div></div></div>' +
    (status ? '<span class="pill">' + esc(status) + '</span>' : '') +
    (joined ? '<span class="pill">Bergabung ' + esc(joined) + '</span>' : '') +
    (badges ? '<div>' + badges + '</div>' : '') +
    (d.bio ? '<p style="margin:16px 0 0;line-height:1.5;color:rgba(255,255,255,.88)">' + esc(d.bio) + '</p>' : '') +
    '<div class="stats">' + stat("Lvl. " + (d.level || 1), "Level") + stat(hours(d.seconds || 0), "Total dengar") + stat(d.days || 0, "Hari aktif") + '</div>' +
    (DOWNLOAD_URL ? '<div class="btns"><a class="btn" href="' + esc(DOWNLOAD_URL) + '">Unduh Aoto</a></div>' : '') +
    (top.length ? '<div class="sect">Paling sering didengar <span class="muted" style="font-weight:400">· 90 hari</span></div><ol>' + top.map((s, i) =>
      '<li><span class="n" style="color:var(--ac);font-weight:800">' + (i + 1) + '</span><img src="' + esc(safeImg(s.cover)) + '" alt="">' +
      '<div class="grow"><div class="t">' + esc(s.title) + '</div><div class="muted" style="font-size:12px">' + esc(artist(s.artist)) + '</div></div></li>').join("") + '</ol>' : '');
  setBanner();
}

async function load() {
  if (CLOUD_URL.indexOf("GANTI_") === 0 || CLOUD_KEY.indexOf("GANTI_") === 0)
    return fail("Server belum diatur. Isi CLOUD_URL dan CLOUD_KEY di Environment Variables Vercel, lalu Redeploy.");
  if (uname) return loadProfile();
  if (!/^[A-Za-z0-9]{4,16}$/.test(code)) return fail("Tautan tidak valid.");
  try {
    const r = await fetch(CLOUD_URL + "/rest/v1/rpc/get_shared_playlist", {
      method: "POST",
      headers: {apikey: CLOUD_KEY, Authorization: "Bearer " + CLOUD_KEY, "Content-Type": "application/json"},
      body: JSON.stringify({p_code: code})
    });
    const d = r.ok ? await r.json() : null;
    if (!d) return fail("Playlist tidak ditemukan atau sudah dihapus.");
    render(d);
  } catch (e) { fail("Tidak bisa menghubungi server."); }
}
function fail(msg) { app.innerHTML = '<div class="err">' + esc(msg) + '</div>'; }
function render(d) {
  const songs = d.songs || [], c = d.creator || {};
  const name = c.display_name || c.username || "Pengguna Aoto";
  document.title = d.title + " · Aoto";
  const av = safeImg(c.avatar_url) ? '<img class="avatar" src="' + esc(safeImg(c.avatar_url)) + '" alt="">'
                          : '<div class="avatar">' + esc(name.slice(0,1).toUpperCase()) + '</div>';
  app.innerHTML =
    '<div class="hero"><img class="cover" src="' + esc(safeImg(songs[0]?.thumbnail)) + '" alt="">' +
    '<div><h1>' + esc(d.title) + '</h1><div class="muted">' + songs.length + (songs.length === 1 ? ' lagu' : ' lagu') + '</div></div></div>' +
    '<div class="creator">' + av + '<div class="grow"><div class="muted" style="font-size:11px">Dibuat oleh</div><b>' + esc(name) + '</b>' +
    (c.username ? '<div class="muted" style="font-size:12px">@' + esc(c.username) + '</div>' : '') + '</div><div class="lvl">Lvl. ' + (c.level || 1) + '</div></div>' +
    '<div class="btns"><a class="btn" href="aoto://p/' + code + '">Buka di Aoto</a>' +
    (DOWNLOAD_URL ? '<a class="btn alt" href="' + esc(DOWNLOAD_URL) + '">Unduh aplikasi</a>' : '') + '</div>' +
    '<ol>' + songs.map((s, i) => '<li><span class="n">' + (i + 1) + '</span><img src="' + esc(safeImg(s.thumbnail)) + '" alt="">' +
      '<div class="grow"><div class="t">' + esc(s.title) + '</div><div class="muted" style="font-size:12px">' + esc(artist(s.subtitle)) + '</div></div></li>').join("") + '</ol>';
  // Coba buka aplikasi otomatis di HP (diabaikan kalau tidak terpasang).
  if (/Android/i.test(navigator.userAgent)) setTimeout(() => { location.href = "aoto://p/" + code; }, 400);
}
load();
</script>
</body>
</html>
